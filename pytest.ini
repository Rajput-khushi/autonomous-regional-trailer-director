# pytest configuration
# Authority: IMPLEMENTATION_PLAN.md §3, PROTOTYPE_SPEC.md NFR-05

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# All tests must run offline (no API keys required — NFR-05).
# Tests that require live API access must be skipped with:
#   @pytest.mark.skipif(not os.getenv("GEMINI_API_KEY"), reason="live mode only")
addopts = -v --tb=short
asyncio_mode = strict
filterwarnings =
    ignore::pytest.PytestDeprecationWarning
